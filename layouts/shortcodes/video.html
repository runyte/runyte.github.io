{{ $src := .Get "src" }}
<figure class="demo-video">
  <video controls playsinline preload="none" src="{{ $src | relURL }}" poster="{{ .Get "poster" | relURL }}" aria-label="{{ .Get "caption" }}">
    <a href="{{ $src | relURL }}">Watch the Runyte demo</a>
  </video>
  <figcaption>{{ .Get "caption" }} <a href="{{ $src | relURL }}">Open video ↗</a></figcaption>
</figure>
