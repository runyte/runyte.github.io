<dialog class="screenshot-viewer" aria-label="Enlarged screenshot" aria-describedby="screenshot-viewer-caption">
  <form method="dialog" class="screenshot-viewer__toolbar">
    <button class="screenshot-viewer__close" autofocus>Close <span aria-hidden="true">×</span></button>
  </form>
  <img class="screenshot-viewer__image" alt="">
  <p id="screenshot-viewer-caption" class="screenshot-viewer__caption"></p>
</dialog>
