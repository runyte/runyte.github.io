<header class="site-header">
  <a class="logo-link" href="{{ .Site.Home.RelPermalink }}" aria-label="Runyte home">
    <pre class="logo" role="img" aria-label="Runyte">{{ (resources.Get "ascii/logo.txt").Content }}</pre>
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Intro</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "features/" | relURL }}"{{ if eq .RelPermalink ("features/" | relURL) }} aria-current="page"{{ end }}>Features</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "screenshots/" | relURL }}"{{ if eq .RelPermalink ("screenshots/" | relURL) }} aria-current="page"{{ end }}>Screenshots</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "performance/" | relURL }}"{{ if eq .RelPermalink ("performance/" | relURL) }} aria-current="page"{{ end }}>Performance</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "installation/" | relURL }}"{{ if eq .RelPermalink ("installation/" | relURL) }} aria-current="page"{{ end }}>Installation</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "help/" | relURL }}"{{ if eq .RelPermalink ("help/" | relURL) }} aria-current="page"{{ end }}>Help</a>
  </nav>
</header>
