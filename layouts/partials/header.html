<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-name" href="{{ .Site.Home.RelPermalink }}"><img src="{{ "images/icon/runyte-64.png" | relURL }}" width="28" height="28" alt="">Runyte</a>
    {{ $current := .RelPermalink }}
    {{ range hugo.Data.navigation }}
      {{ if ne .menu false }}<a href="{{ .url | relURL }}"{{ if eq $current (.url | relURL) }} aria-current="page"{{ end }}>{{ .title }}</a>{{ end }}
    {{ end }}
  </nav>
</header>
