baseURL: "https://runyte.com/"
locale: "en-US"
title: "Runyte"

enableRobotsTXT: true
# The placeholder has no taxonomy content — skip empty /categories/ and /tags/.
disableKinds: ["taxonomy", "term"]
buildDrafts: false
buildFuture: false

params:
  description: "Runyte - an editor-first terminal workspace built around a modal, selection-first editor."
  author: "Krzysztof Arendt"
  image: "images/screenshots/rendered-markdown.webp"
  imageAlt: "Runyte displaying a Markdown document as a formatted page."

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
