baseURL: "https://runyte.com/"
locale: "en-US"
title: "Runyte"

enableRobotsTXT: true
# The placeholder has no taxonomy content — skip empty /categories/ and /tags/.
disableKinds: ["taxonomy", "term"]
buildDrafts: false
buildFuture: false

params:
  description: "Runyte is a Helix-style modal text editor living in your terminal or its own native window."
  demoVideo: "videos/runyte-demo.mp4"
  demoPoster: "videos/runyte-demo-poster.webp"
  author: "Krzysztof Arendt"
  image: "images/screenshots/rendered-markdown.webp"
  imageAlt: "Runyte displaying a Markdown document as a formatted page."

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
